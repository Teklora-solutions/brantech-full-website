<div class="kb-field">
    {% if field.field.widget.input_type == 'checkbox' %}
    <div class="kb-check">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="kb-required" aria-hidden="true"> *</span>{% endif %}</label></div>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="kb-required" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<span class="kb-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
    {{ field.errors }}
</div>
